name: PixelDone-macOS

options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  PixelDoneAppleCore:
    path: ../PixelDoneAppleCore

targets:
  PixelDone:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: PixelDoneApp
    info:
      path: Config/Info.plist
    entitlements:
      path: Config/PixelDone.entitlements
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milesxue.pixeldone.macos
        PRODUCT_NAME: PixelDone
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: PixelDoneAppleCore
        product: PixelDoneDomain
      - package: PixelDoneAppleCore
        product: PixelDoneSyncContract
      - package: PixelDoneAppleCore
        product: PixelDoneDesignFoundation

schemes:
  PixelDone-macOS:
    build:
      targets:
        PixelDone: all
    run:
      config: Debug
    archive:
      config: Release
