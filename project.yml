name: PixelDone-macOS

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "26.5"
  createIntermediateGroups: true

packages:
  PixelDoneAppleCore:
    path: ../PixelDoneAppleCore

targets:
  PixelDone:
    type: application
    platform: macOS
    deploymentTarget: "26.5"
    sources:
      - path: PixelDoneApp
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: PixelDone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSHumanReadableCopyright: CODEX & XUE
        NSPrincipalClass: NSApplication
        PixelDoneSupabasePublishableKey: $(PIXELDONE_SUPABASE_PUBLISHABLE_KEY)
        PixelDoneSupabaseURL: $(PIXELDONE_SUPABASE_URL)
    entitlements:
      path: Config/PixelDone.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milesxue.pixeldone.macos
        PRODUCT_NAME: PixelDone
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    dependencies:
      - package: PixelDoneAppleCore
        product: PixelDoneDomain
      - package: PixelDoneAppleCore
        product: PixelDoneSyncContract
      - package: PixelDoneAppleCore
        product: PixelDoneDesignFoundation

  PixelDoneTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.5"
    sources:
      - path: PixelDoneTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    dependencies:
      - target: PixelDone

  PixelDoneUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "26.5"
    sources:
      - path: PixelDoneUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    dependencies:
      - target: PixelDone

schemes:
  PixelDone-macOS:
    build:
      targets:
        PixelDone: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - PixelDoneTests
        - PixelDoneUITests
